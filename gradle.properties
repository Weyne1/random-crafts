# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 1.6.0
maven_group = net.weyne1.randomcrafts
archives_name = random_crafts
enabled_platforms = fabric,neoforge

# find pack formats here: https://minecraft.wiki/w/Pack_format
datapack_name=randomcrafts
mc_min_pack_format=[88, 0]
mc_max_pack_format=[88, 0]
datapack_description=RandomCrafts generated recipes

# Minecraft properties
minecraft_version = 1.21.9

# find versions here: https://parchmentmc.org/docs/getting-started
parchment_version = 2025.10.05

# Dependencies
architectury_api_version = 18.0.5
fabric_loader_version = 0.19.2
fabric_api_version = 0.134.1+1.21.9
# 21.9.16-beta crashes in mod menu
neoforge_version = 21.9.15-beta
