modLoader = "javafml"
loaderVersion = "[4,)"
#issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "random_crafts"
modUrl = "https://modrinth.com/mod/random-crafts"
version = "${mod_version}"
