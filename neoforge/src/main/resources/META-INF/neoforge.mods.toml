modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/Weyne1/random-crafts/issues"
license = "MIT"

[[mods]]
modId = "random_crafts"
modUrl = "https://modrinth.com/mod/random-crafts"
version = "${mod_version}"
displayName = "Random Crafts"
authors = "Weyne1"
description = '''
Let's randomize crafts for each world! Let the chaos begin...
'''
logoFile = "icon.png"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.random_crafts]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.random_crafts]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "random_crafts.mixins.json"
